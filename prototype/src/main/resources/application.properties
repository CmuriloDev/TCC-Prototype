spring.application.name=prototype
server.port=3000

# Acesso à API do Gemini (Google).
# A chave vem da variável de ambiente GEMINI_API_KEY. O ":" define um valor
# padrão vazio para a aplicação não quebrar na inicialização enquanto a
# variável não estiver definida.
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models
gemini.api.model=gemini-3.6-flash

# Acesso à API do Groq.
# A chave vem da variável de ambiente GROQ_API_KEY. A URL já é o endpoint
# completo de chat completions — sem concatenação de path com o modelo, que
# vai no corpo da requisição (campo "model" do GroqRequest).
groq.api.key=${GROQ_API_KEY:}
groq.api.url=https://api.groq.com/openai/v1/chat/completions
groq.api.model=openai/gpt-oss-120b
